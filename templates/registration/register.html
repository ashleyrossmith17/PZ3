{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<section class="panel">
    <h1>Регистрация пользователя</h1>
    <p class="muted">После успешной регистрации пользователь автоматически входит в систему.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="button" type="submit">Зарегистрироваться</button>
    </form>
</section>
{% endblock %}
