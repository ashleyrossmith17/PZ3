{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="page-title mb-3">{{ title }}</h1>
<form method="post" style="max-width: 640px">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<div class="form-hint">{{ field.help_text }}</div>{% endif %}</div>{% endfor %}
<button class="btn btn-primary" type="submit">Сохранить</button> <a class="btn" href="{% url list_name %}">Отмена</a></form>
{% endblock %}
