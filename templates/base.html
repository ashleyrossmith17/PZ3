<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Django авторизация{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #667085;
            --line: #d0d5dd;
            --accent: #2563eb;
            --accent-dark: #1e40af;
            --success: #0f766e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        header {
            background: #111827;
            color: #ffffff;
            padding: 16px 32px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            max-width: 980px;
            margin: 0 auto;
        }

        nav a,
        nav button {
            color: #ffffff;
            text-decoration: none;
            font: inherit;
        }

        nav button {
            border: 0;
            background: transparent;
            cursor: pointer;
            padding: 0;
        }

        .brand {
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        main {
            width: min(980px, calc(100% - 32px));
            margin: 40px auto;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        p {
            margin: 0 0 16px;
        }

        .muted {
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .button.secondary {
            background: #ffffff;
            color: var(--accent-dark);
        }

        form {
            display: grid;
            gap: 16px;
            margin-top: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
        }

        .helptext,
        .errorlist {
            font-size: 14px;
            color: var(--muted);
            margin: 6px 0 0;
        }

        .errorlist {
            color: #b42318;
            padding-left: 20px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        .fact {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            background: #f9fafb;
        }

        .fact strong {
            display: block;
            color: var(--success);
            margin-bottom: 4px;
        }

        .course-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
            padding: 0;
            list-style: none;
        }

        .course-item {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #f9fafb;
            padding: 16px;
        }

        .course-item strong {
            display: block;
            margin-bottom: 4px;
        }

        .course-item span {
            color: var(--muted);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a class="brand" href="{% url 'home' %}">Практика Django</a>
            <div class="nav-links">
                <a href="{% url 'home' %}">Главная</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}">Профиль</a>
                    <a href="{% url 'course_list' %}">Курсы</a>
                    <form action="{% url 'logout' %}" method="post" style="display:inline; margin:0;">
                        {% csrf_token %}
                        <button type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}">Регистрация</a>
                {% endif %}
                <a href="{% url 'admin:index' %}">Админка</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
